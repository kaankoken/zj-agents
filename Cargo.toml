[workspace]
members = [
  "crates/zj-agents-core",
  "crates/zj-agents-engine",
  "crates/zj-agents-sidebar",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaankoken/zj-agents"
homepage = "https://github.com/kaankoken/zj-agents"
description = "Semantic coding-agent awareness for stock Zellij (engine + sidebar WASM plugins)"

[workspace.dependencies]
regex = "1.5.5"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
strip-ansi-escapes = "0.2"
toml = "1.1"
zellij-tile = "=0.44.3"
