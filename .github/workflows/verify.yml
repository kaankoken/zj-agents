name: verify

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --no-deprecation

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          target: wasm32-wasip1
          cache-key: verify-${{ matrix.os }}
          rustflags: ""

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: WASM release build
        run: cargo build --workspace --release --target wasm32-wasip1

      - name: Assert WASM artifacts
        run: |
          set -euo pipefail
          test -f target/wasm32-wasip1/release/zj-agents-engine.wasm
          test -f target/wasm32-wasip1/release/zj-agents-sidebar.wasm
